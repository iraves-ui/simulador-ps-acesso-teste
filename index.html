<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador PRO SOLUTO</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
  #aviso { font-family: sans-serif; padding: 16px; font-size: 14px; color: #333; }
</style>
</head>
<body>
  <div id="aviso">Carregando o simulador...</div>
  <iframe id="simuladorFrame" onload="document.getElementById('aviso').style.display='none'"></iframe>
  <script>
    // URL do deployment do Apps Script (staging, por enquanto -- so pra
    // teste). O simulador ja libera ser embutido num iframe de qualquer
    // origem (setXFrameOptionsMode(ALLOWALL) em doGet/Code.gs).
    var URL_SIMULADOR = 'https://script.google.com/macros/s/AKfycbwsrDtQot_mFNi4PU3wbi301TtQvUZMg2ZGd1P3HabL_iA4XgO4XGF3nDh6DtbXZJuNZw/exec';

    // O botao "Continuar com o Google" do simulador sai do iframe (via
    // target="_top", o Google nao deixa logar dentro de um iframe de
    // outro site) e navega esta pagina inteira pro login do Google. O
    // Google entao manda de volta pra ESTA MESMA pagina (nao mais direto
    // pro dominio do Apps Script -- ver obterUrlRedirecionamentoOAuth_ em
    // Code.gs) com "?code=...&state=...".
    //
    // Repassar esse "code" pro IFRAME do simulador (tentativa anterior)
    // nao funciona -- o Google recusa com 401 uma requisicao com "code"
    // vinda de dentro de um iframe de outro site. Entao, so nesse passo
    // final (com "code" presente), navega a PROPRIA ABA inteira (nao so o
    // iframe) direto pro simulador ja processando o login. Carregamentos
    // SEM "code" continuam normalmente dentro do iframe (e e isso que
    // contorna o bug do Drive em Android com multiplas contas).
    //
    // IMPORTANTE: limpa "code"/"state" da URL desta pagina ANTES de
    // navegar -- o Google so aceita cada codigo UMA VEZ; sem essa
    // limpeza, revisitar esta mesma aba (ex.: dar "voltar", trocar de
    // app e voltar, o navegador restaurar a aba) tentaria reusar o
    // mesmo codigo ja consumido e cairia direto num erro 401, sempre,
    // nessa aba -- foi exatamente isso que aconteceu no teste anterior.
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var state = params.get('state');
    var iframe = document.getElementById('simuladorFrame');

    if (code) {
      var destino = URL_SIMULADOR + '?code=' + encodeURIComponent(code);
      if (state) destino += '&state=' + encodeURIComponent(state);
      window.history.replaceState(null, '', window.location.pathname);
      window.location.replace(destino);
    } else {
      iframe.src = URL_SIMULADOR;
    }
  </script>
</body>
</html>
